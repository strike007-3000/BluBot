name: Feed Reachability Check

# Temporary diagnostic: runs on this PR (and on demand) to see which feeds GitHub's IPs can fetch.
on:
  pull_request:
    paths:
      - '.github/workflows/feed_check.yml'
      - 'scripts/check_feed_reachability.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m scripts.check_feed_reachability
        env:
          BSKY_HANDLE: "mock.bsky.social"
          BSKY_APP_PASSWORD: "mock-password"
          GEMINI_KEY: "mock-key"
