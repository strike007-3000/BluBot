name: Weekly LinkedIn Draft

on:
  # Sunday 12:00 UTC (the daily bot runs Mon-Fri only)
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

# Own group: a Telegram wait must not block or be blocked by the daily state-persistence group
concurrency:
  group: linkedin-weekly
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Draft LinkedIn post
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          LINKEDIN_TELEGRAM_TIMEOUT_MINUTES: ${{ vars.LINKEDIN_TELEGRAM_TIMEOUT_MINUTES || '10' }}
          LOG_FORMAT: pretty
        run: python linkedin_weekly.py
