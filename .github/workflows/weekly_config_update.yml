name: Weekly Curation Config Update

on:
  schedule:
    - cron: '0 2 * * 5' # 2:00 AM UTC every Friday (4:00 AM UTC+2)
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: weekly-config-update
  cancel-in-progress: true

jobs:
  update-config:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run config updater
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          LOG_FORMAT: pretty
        run: python scripts/update_config_keywords.py

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # Stage config updates
          git add src/config.py || echo "No changes to config"
          git commit -m "chore: weekly update of trending products and keywords" || exit 0
          
          # Use the repository PAT so the resulting PR event can trigger required workflows.
          git fetch origin automated/config-update:refs/remotes/origin/automated/config-update || true
          git checkout -B automated/config-update
          git push origin automated/config-update --force-with-lease
          gh pr create --title "chore: weekly update of trending products and keywords" --body-file pr_body.md --head automated/config-update --base main || gh pr edit automated/config-update --body-file pr_body.md || echo "Failed to create or update PR"
